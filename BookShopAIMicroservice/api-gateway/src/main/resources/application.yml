server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true

          globalcors:
            corsConfigurations:
              '[/**]':
#                allowedOrigins: "http://localhost:5173"
                allowedOriginPatterns: "*"
                allowedMethods: "*"
                allowedHeaders: "*"
                allowCredentials: true


          routes:

            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/users/**, /api/admin/users/**

            - id: book-service
              uri: lb://book-service
              predicates:
                - Path=/api/books/**, /api/authors/**, /api/categories/**, /api/publishers/**, /api/receipts/**

            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/api/orders/**, /api/carts/**, /api/reviews/**, /api/payments/**, /api/favorites/**, /api/admin/stats/**, /api/admin/analytics/**

            - id: rec-service
              uri: http://localhost:8000
              predicates:
                - Path=/cbf/**


            - id: chatbot-service
              uri: http://localhost:8888
              predicates:
                - Path=/chatbot/**


eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/