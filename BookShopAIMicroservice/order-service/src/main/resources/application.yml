server:
  port: 8084

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:mysql://localhost:3306/bookweb_order?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: 123456
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate.format_sql: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: n20dccn037@student.ptithcm.edu.vn
    password: wuqy wehr waja tghu
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

# Feign + timeout m?c ??nh
feign:
  httpclient:
    enabled: true
  client:
    config:
      default:
        connectTimeout: 3000
        readTimeout: 3000

# Resilience4j
resilience4j:
  timelimiter:
    instances:
      bookClient:
        timeoutDuration: 3s
      userClient:
        timeoutDuration: 3s
  circuitbreaker:
    instances:
      bookClient:
        slidingWindowSize: 10
        failureRateThreshold: 50
      userClient:
        slidingWindowSize: 10
        failureRateThreshold: 50



